name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 14
            cc: gcc-14
            cxx: g++-14
          - name: Clang 18
            cc: clang-18
            cxx: clang++-18

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: >
          ctest --test-dir build
          --output-on-failure
          --no-tests=error

  sanitizers:
    name: AddressSanitizer and UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      CC: clang-18
      CXX: clang++-18
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DCHRONOS_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: >
          ctest --test-dir build
          --output-on-failure
          --no-tests=error

  databento-adapter:
    name: Databento adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      CC: clang-18
      CXX: clang++-18

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install provider dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev libzstd-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DCHRONOS_ENABLE_DATABENTO_ADAPTER=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: >
          ctest --test-dir build
          --output-on-failure
          --no-tests=error

  # Fake transports, a manual clock, and a loopback WebSocket server: no
  # credentials and no connection to Alpaca.
  alpaca-adapter:
    name: Alpaca adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install provider dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DCHRONOS_ENABLE_ALPACA_ADAPTER=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: >
          ctest --test-dir build
          --output-on-failure
          --no-tests=error

  postgresql-persistence:
    name: PostgreSQL persistence and paper-trading API
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_DB: chronos
          POSTGRES_PASSWORD: chronos_ci
          POSTGRES_USER: chronos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chronos -d chronos"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      CC: clang-18
      CXX: clang++-18
      CHRONOS_TEST_POSTGRES_URL: >-
        postgresql://chronos:chronos_ci@127.0.0.1:5432/chronos

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PostgreSQL client library
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpq-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DCHRONOS_ENABLE_POSTGRESQL_ADAPTER=ON
          -DCHRONOS_ENABLE_PAPER_TRADING_API=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: >
          ctest --test-dir build
          --output-on-failure
          --no-tests=error

  paper-trading-api-integration:
    name: Paper-trading API with Databento, Alpaca, and sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_DB: chronos
          POSTGRES_PASSWORD: chronos_ci
          POSTGRES_USER: chronos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chronos -d chronos"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      CC: clang-18
      CXX: clang++-18
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      CHRONOS_TEST_POSTGRES_URL: >-
        postgresql://chronos:chronos_ci@127.0.0.1:5432/chronos

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpq-dev libssl-dev libzstd-dev

      # One build tree shares a single hash-pinned cpp-httplib configuration
      # between the API server, the Databento SDK, and the Alpaca adapter;
      # see ADR 0004 and ADR 0009.
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DCHRONOS_ENABLE_SANITIZERS=ON
          -DCHRONOS_ENABLE_POSTGRESQL_ADAPTER=ON
          -DCHRONOS_ENABLE_PAPER_TRADING_API=ON
          -DCHRONOS_ENABLE_DATABENTO_ADAPTER=ON
          -DCHRONOS_ENABLE_ALPACA_ADAPTER=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: >
          ctest --test-dir build
          --output-on-failure
          --no-tests=error

  appleclang:
    name: AppleClang
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: >
          ctest --test-dir build
          --output-on-failure
          --no-tests=error

  web:
    name: Web client
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/web

    # The browser suite answers API requests inside the browser, so this job
    # needs no C++ server, database, credentials, or market data.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
