name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 14
            cc: gcc-14
            cxx: g++-14
          - name: Clang 18
            cc: clang-18
            cxx: clang++-18

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: >
          ctest --test-dir build
          --output-on-failure
          --no-tests=error

  sanitizers:
    name: AddressSanitizer and UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      CC: clang-18
      CXX: clang++-18
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DCHRONOS_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: >
          ctest --test-dir build
          --output-on-failure
          --no-tests=error

  databento-adapter:
    name: Databento adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      CC: clang-18
      CXX: clang++-18

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install provider dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev libzstd-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DCHRONOS_ENABLE_DATABENTO_ADAPTER=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: >
          ctest --test-dir build
          --output-on-failure
          --no-tests=error

  # Fake transports, a manual clock, and a loopback WebSocket server: no
  # credentials and no connection to Alpaca.
  alpaca-adapter:
    name: Alpaca adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install provider dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DCHRONOS_ENABLE_ALPACA_ADAPTER=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: >
          ctest --test-dir build
          --output-on-failure
          --no-tests=error

  postgresql-persistence:
    name: PostgreSQL persistence and paper-trading API
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_DB: chronos
          POSTGRES_PASSWORD: chronos_ci
          POSTGRES_USER: chronos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chronos -d chronos"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      CC: clang-18
      CXX: clang++-18
      CHRONOS_TEST_POSTGRES_URL: >-
        postgresql://chronos:chronos_ci@127.0.0.1:5432/chronos

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PostgreSQL client library
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpq-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DCHRONOS_ENABLE_POSTGRESQL_ADAPTER=ON
          -DCHRONOS_ENABLE_PAPER_TRADING_API=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: >
          ctest --test-dir build
          --output-on-failure
          --no-tests=error

  paper-trading-api-integration:
    name: Paper-trading API with Databento, Alpaca, and sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_DB: chronos
          POSTGRES_PASSWORD: chronos_ci
          POSTGRES_USER: chronos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chronos -d chronos"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      CC: clang-18
      CXX: clang++-18
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      CHRONOS_TEST_POSTGRES_URL: >-
        postgresql://chronos:chronos_ci@127.0.0.1:5432/chronos

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpq-dev libssl-dev libzstd-dev

      # One build tree shares a single hash-pinned cpp-httplib configuration
      # between the API server, the Databento SDK, and the Alpaca adapter;
      # see ADR 0004 and ADR 0009.
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DCHRONOS_ENABLE_SANITIZERS=ON
          -DCHRONOS_ENABLE_POSTGRESQL_ADAPTER=ON
          -DCHRONOS_ENABLE_PAPER_TRADING_API=ON
          -DCHRONOS_ENABLE_DATABENTO_ADAPTER=ON
          -DCHRONOS_ENABLE_ALPACA_ADAPTER=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: >
          ctest --test-dir build
          --output-on-failure
          --no-tests=error

  appleclang:
    name: AppleClang
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: >
          ctest --test-dir build
          --output-on-failure
          --no-tests=error

  # The research package verifies its inputs with the C++ chronos_dataset
  # tool, builds them from synthetic events with a test-only C++ tool, and
  # runs strategy evaluations through chronos_strategy, so this job builds
  # all three first. The demonstration, schedule, strategy, and research
  # service tests run the real tools against synthetic data. No market data,
  # credentials, or network beyond the hash-pinned Python dependencies.
  python-research:
    name: Python research package
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      CC: clang-18
      CXX: clang++-18
      CHRONOS_DATASET: ${{ github.workspace }}/build/chronos_dataset
      CHRONOS_SYNTHETIC_DATASET: ${{ github.workspace }}/build/chronos_synthetic_dataset
      CHRONOS_REQUIRE_TOOLS: "1"

    defaults:
      run:
        working-directory: python

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: python/.python-version

      - name: Build the C++ verifier, synthetic-dataset tool, and strategy runner
        working-directory: .
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel --target chronos_dataset chronos_synthetic_dataset chronos_strategy_cli

      - name: Install pinned dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements.lock

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type-check
        run: python -m mypy

      - name: Test
        run: python -m pytest

      - name: Check deployment validation tools (no credentials or database)
        working-directory: .
        run: |
          python -m ruff format --check tools/deployment_validation
          python -m ruff check tools/deployment_validation
          python -m mypy --strict tools/deployment_validation/validate.py
          python -m unittest discover -s tools/deployment_validation -p 'test_*.py'

  python-onnx-sandbox:
    name: ONNX imports in the sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # Imported models run only in the ONNX sandbox container (ADR 0021), so
    # this job builds its pinned image and runs every ONNX, import,
    # comparison, and registered-worker test with a missing sandbox or
    # missing onnx package as a failure, never a skip.
    env:
      CC: clang-18
      CXX: clang++-18
      CHRONOS_DATASET: ${{ github.workspace }}/build/chronos_dataset
      CHRONOS_SYNTHETIC_DATASET: ${{ github.workspace }}/build/chronos_synthetic_dataset
      CHRONOS_REQUIRE_TOOLS: "1"
      CHRONOS_REQUIRE_ONNX_SANDBOX: "1"

    defaults:
      run:
        working-directory: python

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: python/.python-version

      - name: Build the C++ verifier, synthetic-dataset tool, and strategy runner
        working-directory: .
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel --target chronos_dataset chronos_synthetic_dataset chronos_strategy_cli

      - name: Install pinned dependencies, with the optional ONNX packages
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip install --require-hashes --no-deps -r requirements-onnx.lock

      - name: Type-check with the ONNX packages present
        run: python -m mypy

      - name: Build the ONNX sandbox image
        run: |
          python -m chronos_research onnx-sandbox build
          python -m chronos_research onnx-sandbox status

      - name: Test
        run: python -m pytest

  web:
    name: Web client
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/web

    # The browser suite answers API requests inside the browser, so this job
    # needs no C++ server, database, credentials, or market data.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
