# The demo workspace's own PostgreSQL (ADR 0025). The supervisor runs it as
# the Compose project chronos-demo-<root hash>, so its volume is that
# project's and never the development chronos-postgres-data. Migrations are
# applied by the supervisor, not by an init script. Port and password come
# from the supervisor; it binds to localhost only.
services:
  postgres:
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: chronos_demo
      POSTGRES_USER: chronos_demo
      POSTGRES_PASSWORD: ${CHRONOS_DEMO_POSTGRES_PASSWORD:?the supervisor sets it}
    ports:
      - "127.0.0.1:${CHRONOS_DEMO_POSTGRES_PORT:?the supervisor sets it}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronos_demo -d chronos_demo"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: "no"
    labels:
      org.chronos.demo: "1"

volumes:
  postgres-data:
